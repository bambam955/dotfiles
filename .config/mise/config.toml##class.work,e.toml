[tools]
actionlint = "latest"
bun = "latest"
codex = "latest"
dua = "latest"
flutter = "3.47.2"
fzf = "latest"
git-cliff = "latest"
git-lfs = "latest"
github-cli = "latest"
"gitlab:gitlab-org/cli" = "latest"
go = "latest"
"go:github.com/specture-system/specture" = "latest"
"go:gitlab.com/mrs-electronics/dx/time-tracker" = "0.1.0"
golangci-lint = "latest"
hadolint = "latest"
imagemagick = "7"
jq = "latest"
just = "latest"
lychee = "latest"
markdownlint-cli2 = "latest"
node = "26.8"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@moonrepo/cli" = "latest"
"npm:ccusage" = "latest"
"npm:skills" = "1.7"
opencode = "latest"
opentofu = "latest"
packer = "latest"
pipx = "latest"
"pipx:clang-format" = "22"
"pipx:cmakelang" = { version = "latest", extras = "yaml" }
"pipx:conan" = "latest"
"pipx:kas" = "5.5"
"pipx:oelint-adv" = "9.11"
"pipx:pre-commit" = "latest"
prettier = "3.6.2"
ripgrep = "latest"
ruby = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
tmux = "latest"
usage = "latest"
uv = "latest"
worktrunk = { version = "latest", workflow = "release.yaml" }
yamlfmt = "latest"
yamllint = "latest"
yq = "latest"

[settings]
idiomatic_version_file_enable_tools = ["flutter"]
cache_prune_age = "7d"

[settings.pipx]
uvx = true

[settings.ruby]
compile = false

[settings.npm]
package_manager = "npm"

[settings.status]
show_tools = true

[env]
GOBIN = ""
